# Publishes the website to Hostinger (the build itself is in build-site.yml).
#
# Live site  (public_html)       — push to main, "cms-publish" (sent by the CMS on publish), manual run
# Preview site (drafts, noindex) — push to main, "cms-draft" (sent by the CMS on every save), manual run
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   hPanel → Files → FTP accounts
#   PAYLOAD_URL                              https://cms.babaloocoffeeclub.com
#   PAYLOAD_PREVIEW_SECRET                   same value as PREVIEW_SECRET on the CMS (preview only)
# Repository variables (… → Variables):
#   SITE_URL          https://babaloocoffeeclub.com
#   FTP_SERVER_DIR    /public_html/                     (default)
#   FTP_PROTOCOL      ftps                              (default; use ftp if FTPS is not available)
#   PREVIEW_SITE_URL  https://preview.babaloocoffeeclub.com
#   FTP_PREVIEW_DIR   folder of the preview subdomain as seen by the FTP account
#                     (empty = the preview site is not built)
#   PUBLIC_GTM_ID, PUBLIC_GA4_ID, PUBLIC_GADS_ID, PUBLIC_META_PIXEL_ID, PUBLIC_FORM_ENDPOINT (optional)
name: Build & deploy website

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
      - '.github/workflows/build-site.yml'
  repository_dispatch:
    types: [cms-publish, cms-draft]
  workflow_dispatch:
    inputs:
      target:
        description: Which site to build
        type: choice
        options: [both, live, preview]
        default: both

jobs:
  live:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'cms-publish') ||
      (github.event_name == 'workflow_dispatch' && inputs.target != 'preview')
    uses: ./.github/workflows/build-site.yml
    with:
      site: live
    secrets: inherit

  preview:
    if: >-
      vars.FTP_PREVIEW_DIR != '' && (
      github.event_name == 'push' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'cms-draft') ||
      (github.event_name == 'workflow_dispatch' && inputs.target != 'live'))
    uses: ./.github/workflows/build-site.yml
    with:
      site: preview
    secrets: inherit
