# Builds the Astro site and uploads the static output to Hostinger over FTP/SFTP.
#
# Triggers:
#   - push to main (code changes)
#   - repository_dispatch "cms-publish" (sent by Payload when content changes)
#   - manual run
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      e.g. ftp.babaloocoffeeclub.com  (hPanel → Files → FTP accounts)
#   FTP_USERNAME
#   FTP_PASSWORD
#   PAYLOAD_URL     public URL of the CMS, e.g. https://cms.babaloocoffeeclub.com
# Optional secrets / variables:
#   PAYLOAD_API_KEY, PUBLIC_GTM_ID, PUBLIC_GA4_ID, PUBLIC_GADS_ID, PUBLIC_META_PIXEL_ID
#   FTP_SERVER_DIR  (variable) defaults to /public_html/
name: Build & deploy website

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  repository_dispatch:
    types: [cms-publish]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --workspace apps/web --include-workspace-root

      - name: Restore optimised-image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('apps/web/src/assets/**') }}-${{ github.run_id }}
          restore-keys: |
            astro-images-${{ hashFiles('apps/web/src/assets/**') }}-
            astro-images-

      - name: Build
        working-directory: apps/web
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://babaloocoffeeclub.com' }}
          PAYLOAD_URL: ${{ secrets.PAYLOAD_URL }}
          PAYLOAD_API_KEY: ${{ secrets.PAYLOAD_API_KEY }}
          PUBLIC_CMS_URL: ${{ secrets.PAYLOAD_URL }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_GADS_ID: ${{ vars.PUBLIC_GADS_ID }}
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
        run: npm run build

      - name: Upload build artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: apps/web/dist
          retention-days: 3

      - name: Deploy to Hostinger (FTP)
        if: ${{ secrets.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: apps/web/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
